<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VTimeLLM: boundary-aware three-stage training</title>
<style>
:root{--ink:#172033;--muted:#667089;--line:#dde3ee;--accent:#e8590c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#eef2f8}
body{display:flex;flex-direction:column;overflow:hidden}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:radial-gradient(1200px 700px at 30% 0%,#ffffff 0%,#eef2f8 60%,#e6ebf4 100%)}
canvas{display:block;border-radius:6px}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 16px;background:#ffffffee;border-top:1px solid var(--line);font-size:14px;backdrop-filter:blur(6px)}
#bar button{font:inherit;padding:7px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
#bar button:hover{background:#f2f5fa}
#bar button:focus-visible,#bar select:focus-visible,#bar input:focus-visible{outline:3px solid #9cc5f5;outline-offset:1px}
#bar button.primary{background:var(--ink);color:#fff;border-color:var(--ink);min-width:108px;justify-content:center;font-weight:600}
#bar button.primary:hover{background:#2b3752}
#bar button.on{border-color:var(--accent);color:var(--accent);font-weight:700;background:#fff5ee}
#bar .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#bar label{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
#bar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#fff}
#bar .hint{margin-left:auto;color:var(--muted);font-size:13px}
svg.i{width:14px;height:14px}
</style>
</head>
<body>
<div id="stage"><canvas id="c" role="img" aria-label="Animated explainer of the VTimeLLM three-stage training strategy"></canvas></div>
<div id="bar">
  <button id="prev" aria-label="Previous phase"><svg class="i" viewBox="0 0 14 14"><path d="M3 2v10M12 2 5 7l7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.5"/></svg>Back</button>
  <button id="play" class="primary" aria-label="Pause"><svg class="i" viewBox="0 0 14 14" id="playIcon"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg><span id="playTxt">Pause</span></button>
  <button id="next" aria-label="Next phase">Next<svg class="i" viewBox="0 0 14 14"><path d="M11 2v10M2 2l7 5-7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.5"/></svg></button>
  <span class="sep"></span>
  <button data-st="0">Stage 1</button><button data-st="2">Stage 2</button><button data-st="4">Stage 3</button><button data-st="5">Eval</button>
  <span class="sep"></span>
  <label>Speed <select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
  <label><input type="checkbox" id="auto"> Pause after each phase</label>
  <label><input type="checkbox" id="mask" checked> Highlight loss mask</label>
  <button id="fs">Fullscreen</button>
  <span class="hint">Space pause · ← → phase · 1 2 3 E stage · F fullscreen</span>
</div>
<script>
'use strict';
/*
  VTimeLLM (Huang et al., CVPR 2024, arXiv:2311.18445): boundary-aware three-stage training.
  Numbers, datasets, templates and example sentences come from the paper
  (Sec. 3, Fig. 1-2, Box 1-4, Sec. 4.1, Table 2, Appendix A-C).
  "Illustrative" on screen marks anything not from the paper (loss curve, walk/sit/wave events, drawings).
*/
(function(){
const W=1600,H=900;
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

const C={ink:'#172033',muted:'#667089',faint:'#b4bccb',line:'#e1e6ef',chip:'#cdd4e0',soft:'#f5f7fb',
 frozen:'#2f7fd1',frozenBg:'#e6f1fd',train:'#e8590c',trainBg:'#fff1e7',
 enc:'#f1f4e4',encInk:'#56631f',encAcc:'#8c9a3e',ad:'#faf0e3',adInk:'#7a5028',adAcc:'#c98a4b',vic:'#f5ebe2',vicInk:'#5c3a1e',vicAcc:'#9a6a3c',
 g:'#2f9e44',gBg:'#e5f7e9',p:'#d6336c',pBg:'#fde8f0',
 e1:'#e03131',e2:'#0ca678',e3:'#7048e8',e4:'#f59f00',
 act:'#12b886',z:'#c98a4b',grad:'#e03131',loss:'#e8590c',ice:'#74b9f0',ok:'#2f9e44'};

/* ---------------- drawing helpers ---------------- */
function rr(x,y,w,h,r,fill,stroke,lw,dash){if(w<0){x+=w;w=-w;}r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;if(dash)ctx.setLineDash(dash);ctx.stroke();if(dash)ctx.setLineDash([]);}}
function card(x,y,w,h){ctx.save();ctx.shadowColor='rgba(23,32,51,0.08)';ctx.shadowBlur=22;ctx.shadowOffsetY=6;rr(x,y,w,h,18,'#ffffff');ctx.restore();rr(x,y,w,h,18,null,'#e6eaf2',1);}
function T(s,x,y,size,col,weight,align){ctx.font=(weight||400)+' '+size+'px '+FONT;ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function TW(s,size,weight){ctx.font=(weight||400)+' '+size+'px '+FONT;return ctx.measureText(s).width;}
function L(x0,y0,x1,y1,col,lw,dash,off){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.strokeStyle=col;ctx.lineWidth=lw||1;if(dash){ctx.setLineDash(dash);ctx.lineDashOffset=off||0;}ctx.stroke();if(dash){ctx.setLineDash([]);ctx.lineDashOffset=0;}}
function circ(x,y,r,fill,stroke,lw){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function snowIcon(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.5,s/5);ctx.lineCap='round';
  for(let k=0;k<3;k++){ctx.save();ctx.rotate(k*Math.PI/3);ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(0,s);ctx.moveTo(-s*0.35,-s*0.7);ctx.lineTo(0,-s*0.4);ctx.lineTo(s*0.35,-s*0.7);ctx.moveTo(-s*0.35,s*0.7);ctx.lineTo(0,s*0.4);ctx.lineTo(s*0.35,s*0.7);ctx.stroke();ctx.restore();}ctx.restore();}
function flameIcon(x,y,s,t){ctx.save();ctx.translate(x,y);const f=Math.sin(t*0.25)*0.08;ctx.beginPath();ctx.moveTo(0,s);ctx.bezierCurveTo(-s*0.9,s,-s*0.9,0,-s*0.2,-s*(0.6+f));ctx.bezierCurveTo(-s*0.1,-s*0.2,s*0.25,-s*0.3,s*0.15,-s*(1+f));
  ctx.bezierCurveTo(s*0.9,-s*0.3,s*0.9,s,0,s);ctx.fillStyle=C.train;ctx.fill();ctx.beginPath();ctx.moveTo(0,s*0.9);ctx.bezierCurveTo(-s*0.45,s*0.9,-s*0.35,s*0.2,0,-s*0.1);ctx.bezierCurveTo(s*0.35,s*0.2,s*0.45,s*0.9,0,s*0.9);ctx.fillStyle='#ffc53d';ctx.fill();ctx.restore();}
function statusPill(xr,y,train,label){const lab=label||(train?'Trainable':'Frozen');const w=TW(lab,13.5,700)+38;const x=xr-w;
  rr(x,y,w,26,13,train?C.trainBg:C.frozenBg,train?C.train:C.frozen,1.5);if(train)flameIcon(x+15,y+13,8,gfr);else snowIcon(x+15,y+13,7,C.frozen);T(lab,x+27,y+18,13.5,train?C.train:C.frozen,700);}
function arrowDown(x,y0,y1,col){L(x,y0,x,y1-6,col,2);ctx.beginPath();ctx.moveTo(x-5,y1-8);ctx.lineTo(x+5,y1-8);ctx.lineTo(x,y1);ctx.closePath();ctx.fillStyle=col;ctx.fill();}
function arrowRight(x0,x1,y,col){L(x0,y,x1-6,y,col,2);ctx.beginPath();ctx.moveTo(x1-8,y-5);ctx.lineTo(x1-8,y+5);ctx.lineTo(x1,y);ctx.closePath();ctx.fillStyle=col;ctx.fill();}
function badge(s,x,y,col,bg){const w=TW(s,14,700)+24;rr(x,y,w,28,14,bg,null);T(s,x+12,y+19,14,col,700);return w;}
function clamp01(v){return v<0?0:(v>1?1:v);}
function ease(t){t=clamp01(t);return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function hsh(a,b,c){let h=Math.imul((a*73856093)^(b*19349663)^(c*83492791),2654435761)>>>0;h^=h>>>13;h=Math.imul(h,0x5bd1e995)>>>0;return (h^(h>>>15))>>>0;}
let rs=0x2468ace;function rnd(){rs^=rs<<13;rs^=rs>>>17;rs^=rs<<5;return ((rs>>>0)%10000)/10000;}
const wrapCache=new Map();
function wrapLines(s,size,weight,maxW){const key=s+'|'+size+'|'+weight+'|'+maxW;if(wrapCache.has(key))return wrapCache.get(key);
  const words=s.split(' '),out=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(TW(t,size,weight)>maxW&&cur){out.push(cur);cur=w;}else cur=t;}if(cur)out.push(cur);wrapCache.set(key,out);return out;}

/* ---------------- Box 3 templates (Appendix B), verbatim ---------------- */
const QD=['Could you please detail the events that took place during different time segments in the video?',
"I'm curious about what happened at different points in the video. Could you please describe the events?",
'Could you provide a summary of the incidents that occurred at various timestamps in the video?',
"I'd like to know what events transpired during specific time intervals in the video. Could you please elaborate?",
'Can you give me a breakdown of the occurrences at different time stamps in the video?',
"I'm interested in understanding the events that unfolded at different points in the video. Could you please specify?",
'Could you outline the incidents that happened during different time periods in the video?',
"I'm trying to grasp the sequence of events in the video. Could you please outline what happened at different times?",
'Can you go through the video and describe what took place at different time intervals?',
"I'd appreciate it if you could provide a detailed account of the events that occurred at different timestamps in the video."];
const QE=['Can you describe what occurred from {S} to {E} in the video?','Could you tell me what happened from {S} to {E} in the video?',
'What transpired from {S} to {E} in the video?','Describe what took place from {S} to {E} in the video.',
'Tell me about the events from {S} to {E} in the video.','What was going on from {S} to {E} in the video?',
'Please recount what occurred from {S} to {E} in the video.','Explain what happened from {S} to {E} in the video.',
'Provide details about the events from {S} to {E} in the video.','Share what transpired from {S} to {E} in the video.'];
const QT=['During which frames can we see {T} happening in the video?','Between which frames is {T} visible in the video?',
'At what point in the video can we observe {T} taking place?','Between which two frames can we witness {T} occurring in the video?',
'During which frames in the video can we observe {T} happening?','At which time interval in the video can we see {T} occurring?',
'Between which frames can we find {T} taking place in the video?','At what point in the video can we witness {T} happening?',
'Between which two frames in the video can we observe {T} taking place?','During which frames does {T} occur in the video?'];
function fillE(s,e){return QE.map(q=>q.split('{S}').join(s).split('{E}').join(e));}
function fillT(t){return QT.map(q=>q.split('{T}').join(t));}

/* ---------------- samples ---------------- */
const SC_WATCH=0,SC_SNOW=1,SC_WALK=2,SC_RPS=3,SC_LAP=4;
function hueOf(ev,s,e,def){for(const v of ev)if(v.s===s&&v.e===e)return v.h;return def;}
function ranges(str,ev,def){const out=[];const re=/\bfrom (\d\d) to (\d\d)/gi;let m;
  while((m=re.exec(str))){out.push({a:m.index,b:m.index+m[0].length,c:hueOf(ev,+m[1],+m[2],def)});}
  const re2=/\bT(\d)\b/g;while((m=re2.exec(str))){const n=+m[1]-1;out.push({a:m.index,b:m.index+2,c:n<ev.length?ev[n].h:def});}
  return out;}
const QFONT=18,AFONT=18,TEXTW=1360;
function wrap(str,size,weight){if(TW(str,size,weight)<=TEXTW)return str.length;let i=str.length;
  while(i>0){i=str.lastIndexOf(' ',i-1);if(i<0)break;if(TW(str.substr(0,i),size,weight)<=TEXTW)return i;}return str.length;}
function mkTurn(variants,a,qN,ev,def,templ){
  const t={v:variants,templ:templ,a:a,qN:qN,qshow:templ?40:(variants.length?20:0)};
  t.qwrap=variants.map(v=>wrap(v,QFONT,500));t.qR=variants.map(v=>ranges(v,ev,def));
  const words=a.split(' ');t.nw=words.length;t.awe=[];let p=0;for(const w of words){p+=w.length;t.awe.push(p);p++;}
  t.nr=t.nw+(variants.length?1:0); /* +1 = </s> end token (Box 2) for stage 2/3/eval */
  t.eos=variants.length>0;t.aR=ranges(a,ev,def);t.awrap=wrap(a,AFONT,600);
  t.br=[];for(let i=0;i+3<t.nw;i++){if(words[i].toLowerCase()==='from'&&words[i+2]==='to'){const s=parseInt(words[i+1],10),e=parseInt(words[i+3],10);t.br.push({s:s,e:e,c:hueOf(ev,s,e,def),w0:i,w1:i+3,ce:t.awe[i+3]});}}
  t.qbr=null;if(variants.length){const m=/\bfrom (\d\d) to (\d\d)/i.exec(variants[0]);if(m)t.qbr={s:+m[1],e:+m[2],c:hueOf(ev,+m[1],+m[2],def)};}
  return t;}
let SM=null;
function buildSamples(){
const EV_SNOW=[{s:0,e:93,h:C.e1},{s:94,e:99,h:C.e2}],EV_WALK=[{s:0,e:37,h:C.e1},{s:38,e:69,h:C.e2},{s:70,e:99,h:C.e3}],
      EV_RPS=[{s:50,e:65,h:C.e1},{s:81,e:88,h:C.e3}],EV_LAP=[{s:0,e:24,h:C.e2}];
SM=[
 {video:false,scene:SC_WATCH,ev:[],turns:[mkTurn([],'A grey watch with an army style strap.',0,[],C.e4,false)]},
 {video:true,scene:SC_SNOW,thumbs:[0,25,50,75,96],ev:EV_SNOW,legend:[['from Fig. 2: ',C.muted],['snowboarding down the hill',C.e1],['   ',C.muted],['taking boards off',C.e2]],
  turns:[mkTurn(QD,'People are snowboarding down a large hill of snow, from 00 to 93. The people get to the bottom and start taking their snowboards off, from 94 to 99.',8,EV_SNOW,C.e4,true)]},
 {video:true,multi:true,scene:SC_WALK,thumbs:[5,25,50,75,95],ev:EV_WALK,legend:[['T1 walks',C.e1],['   ',C.muted],['T2 sits',C.e2],['   ',C.muted],['T3 waves',C.e3],['   (illustrative events)',C.muted]],
  turns:[mkTurn(fillE('38','69'),'T2.',4,EV_WALK,C.e4,true),mkTurn(fillE('70','99'),'T3.',4,EV_WALK,C.e4,true),mkTurn(fillT('T1'),'From 00 to 37.',4,EV_WALK,C.e4,true)]},
 {video:true,scene:SC_RPS,thumbs:[20,55,72,84,95],ev:EV_RPS,legend:[['1st game',C.e1],['   ',C.muted],['2nd game (blindfolded)',C.e3],['   from Fig. 2',C.muted]],
  turns:[mkTurn(['Can you help me count how many times the two people play rock-paper-scissors in the video?'],
   'Of course! These two people play rock-paper-scissors twice. The first time is from 50 to 65, and after the woman puts a blindfold on, they play again, from 81 to 88.',8,EV_RPS,C.e4,false)]},
 {video:true,evalS:true,scene:SC_LAP,thumbs:[0,8,16,24,60],ev:EV_LAP,legend:[['ground truth 0 s to 4 s',C.e2],['   ',C.muted],['prediction 00 to 30',C.e3]],
  turns:[mkTurn(["During which time period in the video does the event 'person close the laptop' happen?"],'The person closes the laptop from 00 to 30.',8,EV_LAP,C.e3,false)]}];
}
function hueAt(sm,k){for(const v of sm.ev)if(k>=v.s&&k<=v.e)return v.h;return null;}

const PFX='USER: This is a video with 100 frames:';

/* ---------------- state machine ---------------- */
const ST_S1=0,ST_T1=1,ST_S2=2,ST_T2=3,ST_S3=4,ST_EV=5,ST_RS=6;
const P_LOAD=0,P_FWD=1,P_LOSS=2,P_BWD=3,P_STEP=4,P_TR=5,P_GEN=6,P_IOU=7,P_RESET=8;
const steps=[];
function add(st,ph,sm,it,n){steps.push({st:st,ph:ph,sm:sm,it:it,n:n});}
function addIter(st,sm,it,n){for(const ph of [P_LOAD,P_FWD,P_LOSS,P_BWD,P_STEP])add(st,ph,sm,it,n);}
for(let i=0;i<2;i++)addIter(ST_S1,0,i,2);
add(ST_T1,P_TR,0,0,1);
for(let i=0;i<2;i++)addIter(ST_S2,-1,i,2);
add(ST_T2,P_TR,-2,0,1);
for(let i=0;i<2;i++)addIter(ST_S3,3,i,2);
add(ST_EV,P_LOAD,4,0,1);add(ST_EV,P_GEN,4,0,1);add(ST_EV,P_IOU,4,0,1);add(ST_RS,P_RESET,4,0,1);

const WORD_T=12;
let loop=0,stepIdx=0,lt=0,gfr=0,paused=false,maskOn=true,speed=1,autoPause=false;
let curStage=0,curPhase=0,curSample=0,curIter=0,curIterN=1,curDur=1;
function sampleOf(k){const s=steps[k].sm;if(s===-1)return (((steps[k].it+loop)&1)===0)?1:2;if(s===-2)return (((1+loop)&1)===0)?1:2;return s;}
function fwdDur(sm){let d=90;for(const t of sm.turns)d+=t.qshow+t.nr*WORD_T+30;return d;}
function durOf(k){const p=steps[k].ph,sm=SM[sampleOf(k)];
  if(p===P_LOAD)return 200;if(p===P_FWD||p===P_GEN)return fwdDur(sm)+40;if(p===P_LOSS)return 130;if(p===P_BWD)return 160;if(p===P_STEP)return 110;
  if(p===P_TR)return steps[k].st===ST_T1?420:600;if(p===P_IOU)return 460;return 60;}
let lossArrived=0,adFlash=0,loraFlash=0;
function setStep(k){stepIdx=k;lt=0;const s=steps[k];curStage=s.st;curPhase=s.ph;curSample=sampleOf(k);curIter=s.it;curIterN=s.n;curDur=durOf(k);lossArrived=0;syncButtons();}
function nextStep(auto){let k=stepIdx+1;if(k>=steps.length){k=0;loop++;}setStep(k);if(auto&&autoPause)setPaused(true);}
function prevStep(){let k=stepIdx-1;if(k<0)k=steps.length-1;setStep(k);clearParticles();}
function firstOf(st){for(let k=0;k<steps.length;k++)if(steps[k].st===st)return k;return 0;}

let adapterTrain=false,gShow=false,gOff=0,gTrain=false,pShow=false,pOff=0,pTrain=false,stripe=0,loraTrainNow=false,expandAmt=0;
function derive(){
  adapterTrain=curStage===ST_S1||(curStage===ST_T1&&lt<80);
  gShow=false;gOff=0;gTrain=false;pShow=false;pOff=0;pTrain=false;stripe=0;
  if(curStage===ST_T1){if(lt>=150){gShow=true;gTrain=true;gOff=(1-ease((lt-150)/100))*190;}}
  else if(curStage===ST_S2){gShow=true;gTrain=true;}
  else if(curStage===ST_T2){if(lt<150){gShow=true;gOff=-ease((lt-30)/110)*120;}stripe=clamp01((lt-130)/30);
    if(lt>=360){pShow=true;pTrain=true;pOff=(1-ease((lt-360)/100))*190;}}
  else if(curStage>=ST_S3){stripe=1;pShow=true;pTrain=curStage===ST_S3;}
  loraTrainNow=(gShow&&gTrain&&gOff<1)||(pShow&&pTrain&&pOff<1);
  expandAmt=curPhase===P_LOAD?ease((lt-100)/70):1;
}
const REV=[0,0,0,0],REVC=[0,0,0,0];let shownTurn=0,varShown=0,flipActive=false;
function chosenVar(t){const tr=SM[curSample].turns[t];return tr.templ?(hsh(loop+1,curSample,t)%10):0;}
function computeTurns(){
  const sm=SM[curSample],nt=sm.turns.length;shownTurn=0;flipActive=false;let fi=-1;
  if(curPhase===P_LOAD){for(let t=0;t<nt;t++){REV[t]=0;REVC[t]=0;}if(sm.turns[0].templ&&lt>=40&&lt<80){flipActive=true;fi=((lt-40)/10)|0;}}
  else if(curPhase===P_FWD||curPhase===P_GEN){let ts=90;for(let t=0;t<nt;t++){const tr=sm.turns[t];if(lt>=ts)shownTurn=t;let r=0;
      if(lt>=ts+tr.qshow){r=(((lt-ts-tr.qshow)/WORD_T)|0)+1;if(r>tr.nr)r=tr.nr;}
      REV[t]=r;REVC[t]=r>=tr.nw?tr.a.length:(r>0?tr.awe[r-1]:0);
      if(t>0&&tr.templ&&lt>=ts&&lt<ts+40){flipActive=true;fi=((lt-ts)/10)|0;}
      ts+=tr.qshow+tr.nr*WORD_T+30;}}
  else{for(let t=0;t<nt;t++){REV[t]=sm.turns[t].nr;REVC[t]=sm.turns[t].a.length;}shownTurn=nt-1;}
  const ch=chosenVar(shownTurn);varShown=(flipActive&&fi>=0)?(ch+3-fi+10)%10:ch;if(!sm.turns[shownTurn].templ)varShown=0;
}

/* ---------------- geometry ---------------- */

/* ---------------- narration: one plain-language sentence per phase ---------------- */
function narration(){
  const sm=SM[curSample];
  switch(curStage){
  case ST_S1:
    if(curPhase===P_LOAD)return 'Stage 1 teaches the LLM to read visual features. The data are 558K image-caption pairs; the image is turned into a single token placed before its caption.';
    if(curPhase===P_FWD)return 'The frozen CLIP encoder turns the image into features and keeps only the CLS token. The trainable adapter f maps it into the LLM, and the frozen LLM then predicts the caption word by word.';
    if(curPhase===P_LOSS)return 'The loss is standard next-token prediction on the caption words.';
    if(curPhase===P_BWD)return 'Gradients travel back through the frozen LLM without changing it, and stop at the adapter f, the only trainable part.';
    return 'The optimizer updates f alone. Result: visual features now live in the same space as the LLM\u2019s word embeddings.';
  case ST_T1:return 'Stage 1 \u2192 2: the adapter f is frozen for good, and a small LoRA module (r = 64, \u03b1 = 128) is attached to Vicuna. From now on only LoRA weights learn.';
  case ST_S2:
    if(curPhase===P_LOAD)return sm.multi?'Stage 2 trains boundary awareness on 134K multi-event videos. Every video is resampled to exactly 100 frames, so a time is simply a frame number from 00 to 99. This sample is multi-turn QA (80% of the data).':
      'Stage 2 trains boundary awareness on 134K multi-event videos. Every video is resampled to exactly 100 frames, so a time is simply a frame number from 00 to 99. This sample is single-turn dense captioning (20%).';
    if(curPhase===P_FWD)return sm.multi?'Each event is asked about either as captioning (\u201cwhat happened from s to e?\u201d) or as grounding (\u201cwhen does it happen?\u201d), in shuffled order. The 100 frame embeddings replace <video>; no extra temporal module is used.':
      'Each frame is encoded on its own; the 100 CLS embeddings replace the <video> token. There is no extra temporal module: the LLM reads the frames in order and answers with \u201cfrom s to e\u201d.';
    if(curPhase===P_LOSS)return 'Only the answer tokens are scored. The system prompt, the 100 frame embeddings and the question are masked out of the loss.';
    if(curPhase===P_BWD)return 'Gradients reach only the LoRA. The frozen adapter and encoder receive nothing.';
    return 'The LoRA update teaches the model where events start and end, and how to write those boundaries as frame numbers.';
  case ST_T2:return 'Stage 2 \u2192 3: the stage-2 LoRA is merged into Vicuna\u2019s weights, keeping its temporal skills, and a fresh LoRA is attached for stage 3.';
  case ST_S3:
    if(curPhase===P_LOAD)return 'Stage 3 uses about 36K high-quality dialogues: Vicuna-7B rewrote the human-annotated events of ActivityNet Captions and DiDeMo as conversations, and 20K VideoInstruct100K samples were added.';
    if(curPhase===P_FWD)return 'Same pipeline, but now the questions are natural conversation and the answer weaves exact frame numbers into normal sentences.';
    if(curPhase===P_LOSS)return 'Again, only the answer tokens are scored.';
    if(curPhase===P_BWD)return 'Only the new stage-3 LoRA receives gradients.';
    return 'Stage 3 restores normal chatting after the templated QA of stage 2, and the manual labels sharpen the boundaries.';
  case ST_EV:
    if(curPhase===P_LOAD)return 'Evaluation, temporal grounding (Figure 1): a 16-second clip and the query \u201cperson close the laptop\u201d. The true event spans 0 s to 4 s.';
    if(curPhase===P_GEN)return 'Inference: nothing is trained. The model writes its answer one token at a time and names the event with frame numbers.';
    return 'Frame 30 of 0\u201399 in a 16 s clip is about 4.8 s, so the prediction overlaps the truth almost perfectly (IoU \u2248 0.83).';
  default:return 'The animation restarts at stage 1.';}
}

    const mx=(x0+x1)/2,cx=(AB0[gi]+AB1[gi])/2,yy=644+(gi&1)*6;L(mx,586,mx,yy,c,2);L(mx,yy,cx,yy,c,2);L(cx,yy,cx,STRIP_Y-8,c,2);circ(cx,STRIP_Y-8,3.5,c);});});
  if(curStage===ST_S2||curStage===ST_S3)T('brackets = the \u201cfrom s to e\u201d spans in the answer',1098,610,12.5,C.muted,600);
}

/* ---------------- BOTTOM: token sequence ---------------- */
function drawStrip(){
  const sm=SM[curSample],y=STRIP_Y,E=expandAmt,ev=!!sm.evalS;nAC=0;
  const segs=[];let x=44;const PAD=8,GAP=12;const tp=14,tw=10;
  function seg(kind,w,label,extra){segs.push({kind:kind,x:x,w:w,label:label,extra:extra});x+=w+PAD*2+GAP;}
  if(sm.video){
    seg('sys',3*tp-4,'system prompt');
    const pw=TW(PFX,14,600)+8;seg('pfx',pw+(3*tp-4-pw)*E,E<0.5?'prefix':'prefix');
    seg('vid',86+(700-86)*E,E>=1?'100 frame embeddings z1 \u2026 z100 (they replace <video>)':'<video> placeholder');
  }else seg('img',86+(16-86)*E,E>=1?'Z_I':'<image>');
  sm.turns.forEach((tr,t)=>{if(tr.qN>0)seg('q',tr.qN*tp-4,sm.multi?'Q'+(t+1):'question',t);seg('a',tr.nr*tp-4,sm.video?(ev?'answer (generated)':(sm.multi?'A'+(t+1):'answer')):'caption',t);});
  /* containers + labels */
  let prevEnd=0;
  for(const s of segs){const isA=s.kind==='a';const scored=isA&&!ev;const dim=maskOn&&!isA&&!ev;
    rr(s.x,y-6,s.w+PAD*2,CHIP_H+12,10,scored&&maskOn?'#fff4ec':'#f5f7fb',scored&&maskOn?C.train:null,1.5);
    let lab=s.label;if(scored&&maskOn&&!sm.multi)lab+=' \u2013 scored';
    const lw=TW(lab,12.5,700);let lx=s.x+(s.w+PAD*2)/2-lw/2;if(lx<prevEnd+10)lx=prevEnd+10;if(lx<44)lx=44;
    T(lab,lx,y-12,12.5,isA?C.train:(dim?C.faint:C.muted),700);prevEnd=lx+lw;s.cx=s.x+PAD;}
  let g=0;
  for(const s of segs){const cx=s.cx,dimA=maskOn&&s.kind!=='a'&&!ev?0.45:1;ctx.globalAlpha=dimA;
    if(s.kind==='sys'){for(let i=0;i<3;i++)rr(cx+i*tp,y,tw,CHIP_H,3,'#98a2b3');}
    else if(s.kind==='pfx'){if(E<0.5){ctx.globalAlpha=dimA*(1-E*2);T(PFX,cx+4,y+17,14,C.ink,600);ctx.globalAlpha=dimA;}if(E>0){ctx.globalAlpha=dimA*Math.min(1,E*2);for(let i=0;i<3;i++)rr(cx+(s.w-tw)*i/2,y,tw,CHIP_H,3,'#98a2b3');}}
    else if(s.kind==='vid'){if(E<=0){ctx.globalAlpha=1;rr(cx,y-2,86,CHIP_H+4,8,'#fff4e6',C.train,2);T('<video>',cx+43,y+17,15,C.train,800,'center');}
      else{const n=E>=1?100:Math.floor(100*E);for(let i=0;i<n;i++)rr(cx+i*(s.w-6)/99,y,6,CHIP_H,2,(i&1)?'#9a6a3c':'#d8b07e');}}
    else if(s.kind==='img'){if(E<=0){rr(cx,y-2,86,CHIP_H+4,8,'#fff4e6',C.train,2);T('<image>',cx+43,y+17,15,C.train,800,'center');}else rr(cx+(s.w-16)/2,y,16,CHIP_H,3,'#d8b07e');}
    else if(s.kind==='q'){for(let i=0;i<SM[curSample].turns[s.extra].qN;i++)rr(cx+i*tp,y,tw,CHIP_H,3,'#b3bccb');QB0[s.extra]=cx;QB1[s.extra]=cx+s.w;}
    else if(s.kind==='a'){ctx.globalAlpha=1;const tr=sm.turns[s.extra],r=REV[s.extra];
      for(let w=0;w<tr.nr;w++){const lit=w<r,xx=cx+w*tp;
        if(ev&&!lit)rr(xx,y,tw,CHIP_H,3,null,'#dfe4ec',1.2,[3,3]);
        else if(lit){rr(xx,y,tw,CHIP_H,3,w===tr.nw&&tr.eos?'#ffa94d':C.train);}
        else rr(xx,y,tw,CHIP_H,3,'#ffffff',C.faint,1.2);
        ACX[nAC++]=xx;tr.br.forEach((br,b)=>{if(w===br.w0)AB0[g+b]=xx;if(w===br.w1)AB1[g+b]=xx+tw;});}
      g+=tr.br.length;}
    ctx.globalAlpha=1;}
}
function rich(str,a,b,x,y,size,weight,base,R,revc,hide){
  ctx.font=weight+' '+size+'px '+FONT;ctx.textAlign='left';let i=a;
  while(i<b){let col=base,end=b;for(const r of R){if(i>=r.a&&i<r.b){col=r.c;end=Math.min(end,r.b);break;}if(r.a>i)end=Math.min(end,r.a);}
    let unrev=false;if(revc>=0){if(i>=revc)unrev=true;else end=Math.min(end,revc);}
    if(unrev){if(hide)return;col=C.faint;}
    const s=str.substring(i,end);ctx.fillStyle=col;ctx.fillText(s,x,y);x+=ctx.measureText(s).width;i=end;}}
const TR_TXT=[['Stage 1 \u2192 2: freeze the adapter, add a LoRA',

 ['Stage 2 \u2192 3: merge the LoRA, add a new one',

  const sm=SM[curSample],tr=sm.turns[shownTurn],ev=!!sm.evalS,TX=176;
  if(!sm.video){T('CAPTION',48,784,12.5,C.train,800);rich(tr.a,0,tr.a.length,TX,790,24,700,C.ink,tr.aR,REVC[shownTurn],false);
    T('the LLM must predict each caption word from the image embedding and the words before it',TX,828,14,C.muted,500);return;}

  T('ANSWER',48,830,12.5,C.train,800);T(ev?'generated by the model':'training target',48,848,12,C.faint,700);
  const as=tr.awrap;rich(tr.a,0,as,TX,830,AFONT,700,C.ink,tr.aR,REVC[shownTurn],ev);
  if(as<tr.a.length)rich(tr.a,as+1,tr.a.length,TX,856,AFONT,700,C.ink,tr.aR,REVC[shownTurn],ev);
}

/* ---------------- frame ---------------- */
function render(){
  derive();computeTurns();
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f8faff');g.addColorStop(1,'#edf1f8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

}
let scale=1;
function resize(){const st=document.getElementById('stage');const aw=st.clientWidth,ah=st.clientHeight;scale=Math.min(aw/W,ah/H);const dpr=window.devicePixelRatio||1;
  cv.style.width=Math.floor(W*scale)+'px';cv.style.height=Math.floor(H*scale)+'px';cv.width=Math.floor(W*scale*dpr);cv.height=Math.floor(H*scale*dpr);ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);}

const playBtn=document.getElementById('play'),playTxt=document.getElementById('playTxt'),playIcon=document.getElementById('playIcon');

  playIcon.innerHTML=v?'<path d="M3 2l9 5-9 5z" fill="currentColor"/>':'<rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/>';}

  document.querySelectorAll('#bar button[data-st]').forEach(b=>b.classList.toggle('on',+b.dataset.st===grp));}
playBtn.onclick=()=>setPaused(!paused);
document.getElementById('next').onclick=()=>{nextStep(false);clearParticles();};
document.getElementById('prev').onclick=()=>prevStep();
document.querySelectorAll('#bar button[data-st]').forEach(b=>b.onclick=()=>jump(+b.dataset.st));
document.getElementById('speed').onchange=e=>{speed=+e.target.value;};
document.getElementById('auto').onchange=e=>{autoPause=e.target.checked;};
const maskBox=document.getElementById('mask');maskBox.onchange=e=>{maskOn=e.target.checked;};
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen&&document.exitFullscreen();}
document.getElementById('fs').onclick=toggleFS;
document.addEventListener('fullscreenchange',()=>setTimeout(resize,50));
window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;const k=e.key;
  if(k===' '){setPaused(!paused);e.preventDefault();}else if(k==='ArrowRight'){nextStep(false);clearParticles();e.preventDefault();}
  else if(k==='ArrowLeft'){prevStep();e.preventDefault();}else if(k==='1')jump(ST_S1);else if(k==='2')jump(ST_S2);else if(k==='3')jump(ST_S3);
  else if(k==='e'||k==='E')jump(ST_EV);else if(k==='m'||k==='M'){maskOn=!maskOn;maskBox.checked=maskOn;}else if(k==='f'||k==='F')toggleFS();});
let last=0,acc=0;const STEP_S=1/60;
function frame(ts){if(!last)last=ts;let dt=(ts-last)/1000;last=ts;if(dt>0.25)dt=0.25;if(dt<0)dt=0;if(!paused)acc+=dt*speed;let n=0;
  while(acc>=STEP_S&&n<10){update();acc-=STEP_S;n++;}if(n>=10)acc=0;render();requestAnimationFrame(frame);}
buildSamples();setStep(0);resize();requestAnimationFrame(frame);
if(typeof window.__VT_TEST__==='function')window.__VT_TEST__({update,render,setStep,steps,durOf,st:()=>({stepIdx,lt,curStage,curPhase})});
})();
